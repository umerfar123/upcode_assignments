<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>
<body>
    <script>
        var a = [1,2,3,4,5]
        var b = ["umr","far","kp","hello"]

        a.push(6)
        console.log(b[3],b[0],b[1],b[2])
        console.log("Array a :",a)
        console.log("Length of a :",a.length)
        a.pop()
        console.log("Array a after pop :",a)
        console.log("Length of a after pop:",a.length)
    </script>
</body>
</html>
