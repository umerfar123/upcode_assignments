<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Box Model</title>

    <style>

        html,body {
            margin: 0;
        }

        div {
            overflow: auto;
        }

      .main {
        background-color: lightcoral;
        height: 100vh;
        width: 100vw;
      }

      .sectionhead{
        background-color: bisque;
        height: 40vh;
        width: 50vw;
        margin: 5px;
        padding: 10px;

      }
      .headContent{
        background-color: lightcyan;
        padding: 3px;
        border: 1px solid blue;
        margin: 10px;
      }

    </style>
  </head>
  <body>
    <div class="main">

      <div class="sectionhead">
        <span class="headContent">Testing css box model</span>
      </div>

      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSR92MWyPZxARx7B-rjCO-wr5aJfYxFMFGiswTdZK_Irw&s=10"
        alt="box-model"
      />
      

      <a href="https://stackoverflow.com/questions/19718634/how-to-disable-margin-collapsing">Margin Collapse issue in css box model>
    </div>
  </body>
</html>
