<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Function</title>
</head>
<body>
    <h1>Javascript Function</h1>
    <script>

        var count = 0
        function addTwoNumber(x,y) {
            var sum = x+y;
            return sum;
        }
        function multiTwoNumber(x,y){
            var mult = x*y;
            return mult
        }

        function counter(){
            count += 1
            console.log("Counter",count)
        }

        document.write(addTwoNumber(10,11))
        document.write(multiTwoNumber(5,2))

        document.write(typeof(true))
        document.write(typeof(1))
        document.write(typeof("hello"))
    </script>
    <br>
    <button onclick="counter()">Counter</button>
</body>
</html>
